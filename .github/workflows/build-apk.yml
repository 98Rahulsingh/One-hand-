name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the project
        run: |
          if [ -d app ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            Z=$(ls *.zip | head -n1)
            mkdir proj && unzip -q "$Z" -d proj
            D=$(dirname "$(find proj -maxdepth 3 -name settings.gradle.kts | head -n1)")
            echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
        name: OneHandControl-debug-apk
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
