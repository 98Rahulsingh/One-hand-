name: Extract Zip to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip OneHandControl-fixed.zip
        shell: bash
        run: |
          mkdir -p /tmp/extracted
          unzip -q OneHandControl-fixed.zip -d /tmp/extracted
          ROOT=$(find /tmp/extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          cp -r "$ROOT"/. .
          rm -rf /tmp/extracted

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Extract OneHandControl source from zip"
          git push
